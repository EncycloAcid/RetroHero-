name: Build RetroHero APK

on:
  push:
    branches:
      - main
      - master
      - "ccr-*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21: Robolectric needs it to run tests against Android SDK 35+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK 27.2.12479018 and CMake 3.22.1
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode persistent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RETROHERO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KS_PATH="${RUNNER_TEMP}/retrohero-signing.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
            echo "RETROHERO_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ERROR: RETROHERO_KEYSTORE_B64 secret is required for tagged releases so APKs can update in-place."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug & Release APKs
        env:
          RETROHERO_STORE_PASSWORD: ${{ secrets.RETROHERO_STORE_PASSWORD }}
          RETROHERO_KEY_ALIAS: ${{ secrets.RETROHERO_KEY_ALIAS }}
          RETROHERO_KEY_PASSWORD: ${{ secrets.RETROHERO_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify APK signing certificate
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-universal-release.apk | grep -E "Owner:|SHA256:" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retrohero-debug-apk
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Show APK sizes
        run: ls -lh app/build/outputs/apk/*/*.apk

      # arm64 fits almost every phone from the last ~8 years; universal runs anywhere.
      - name: Upload Release APK (arm64, most phones)
        uses: actions/upload-artifact@v4
        with:
          name: retrohero-release-arm64-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload Release APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: retrohero-release-universal-apk
          path: app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload Release APKs (other CPU types)
        uses: actions/upload-artifact@v4
        with:
          name: retrohero-release-other-abis-apk
          path: |
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT=app/build/outputs/apk
          cp $OUT/release/app-arm64-v8a-release.apk "RetroHero-${TAG}-arm64.apk"
          cp $OUT/release/app-armeabi-v7a-release.apk "RetroHero-${TAG}-armv7.apk"
          cp $OUT/release/app-x86_64-release.apk "RetroHero-${TAG}-x86_64.apk"
          cp $OUT/release/app-universal-release.apk "RetroHero-${TAG}-universal.apk"
          cp $OUT/debug/app-universal-debug.apk "RetroHero-${TAG}-debug.apk"
          gh release create "$TAG" \
            "RetroHero-${TAG}-arm64.apk" \
            "RetroHero-${TAG}-armv7.apk" \
            "RetroHero-${TAG}-x86_64.apk" \
            "RetroHero-${TAG}-universal.apk" \
            "RetroHero-${TAG}-debug.apk" \
            --title "RetroHero ${TAG}" \
            --generate-notes
